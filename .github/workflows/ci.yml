name: CI

# Run the pinned development `mise run check` gate on every primary OS.
# The MSRV job verifies the declared minimum, current-stable checks forward
# compatibility with the full test suite, and release verifies the pinned
# build/package/install path.
# Configure branch protection to require these status checks:
#   - check (ubuntu-latest)
#   - check (macos-latest)
#   - check (windows-latest)

on:
  push:
    branches: [main, develop]
    tags:
      - "*.*.*"
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: MSRV (Rust 1.89.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup MSRV
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.89.0
          cache: false
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.89.0-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.89.0-cargo-
      - name: Build default features with MSRV
        run: cargo build --locked
      - name: Test default features with MSRV
        run: cargo test --locked
      - name: Build all features with MSRV
        run: cargo build --all-features --locked
      - name: Test all features with MSRV
        run: cargo test --all-features --locked

  check:
    name: check
    runs-on: ${{ matrix.os }}
    env:
      MISE_AUTO_INSTALL: "false"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pinned development toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          install: true
          install_args: rust mdbook
          cache: true
      - name: Install Rust quality components
        run: rustup component add --toolchain 1.97.0 clippy rustfmt
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.0-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.0-cargo-

      - name: Verify Git CLI availability
        run: git --version

      - name: Run pinned check (test + lint + docs + fmt)
        run: mise run check

  current-stable:
    name: current stable compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup latest stable Rust
        # Pinned to a SHA, so the toolchain can no longer be inferred from the
        # `@stable` ref and must be named explicitly.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-stable-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-stable-cargo-
      - name: Test all features on latest stable
        run: cargo test --all-features --locked

  release:
    name: release build and package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pinned release toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          install: true
          install_args: rust
          cache: true
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.0-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.0-cargo-
      - name: Verify release metadata and SQLite compatibility guidance
        run: ./scripts/check-release-metadata.sh
      - name: Build release artifact with locked dependencies
        run: cargo build --release --all-features --locked
      - name: Verify allowlisted crate package and packaged crate tests
        run: ./scripts/verify-package.sh
      - name: Verify source install with locked dependencies
        run: cargo install --path . --locked --root "$RUNNER_TEMP/pinto"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          install: true
          install_args: rust cargo:cargo-llvm-cov
          cache: true
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.0-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.0-cargo-
      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview
      - name: Measure coverage
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run coverage
      - name: Check Kanban runtime coverage
        run: ./scripts/check-kanban-coverage.sh coverage.xml 0.90
      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  dependency-policy:
    name: dependency security and licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          install: true
          install_args: rust cargo:cargo-audit cargo:cargo-deny
          cache: true
      - name: Audit known vulnerabilities
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run audit
      - name: Check dependency policy
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run deny

  large-board-smoke:
    name: large-board 1,000-item smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pinned development toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          install: true
          install_args: rust
          cache: true
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.0-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.0-cargo-
      - name: Build benchmark runner
        run: cargo build --release --bin pinto --example large_board_bench --locked
      - name: Run 1,000-item benchmark gate
        run: >-
          tolerance=20;
          if [ "${ACT:-}" = "true" ]; then tolerance=50; fi;
          ./scripts/large-board-benchmark.sh
          --sizes 1000
          --samples 3
          --baseline benchmarks/large-board-baseline-linux-x86_64.json
          --tolerance "$tolerance"
          --output target/large-board-smoke.json
      - name: Upload benchmark evidence
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: large-board-smoke-${{ github.run_id }}
          path: target/large-board-smoke.json
          retention-days: 14
          if-no-files-found: ignore

  large-board-scheduled:
    name: large-board 10,000-item scheduled benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pinned development toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          install: true
          install_args: rust
          cache: true
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.0-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.0-cargo-
      - name: Build benchmark runner
        run: cargo build --release --bin pinto --example large_board_bench --locked
      - name: Run 10,000-item benchmark gate
        run: >-
          tolerance=20;
          if [ "${ACT:-}" = "true" ]; then tolerance=50; fi;
          ./scripts/large-board-benchmark.sh
          --sizes 10000
          --samples 3
          --baseline benchmarks/large-board-baseline-linux-x86_64.json
          --tolerance "$tolerance"
          --output target/large-board-scheduled.json
      - name: Upload benchmark evidence
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: large-board-scheduled-${{ github.run_id }}
          path: target/large-board-scheduled.json
          retention-days: 14
          if-no-files-found: ignore

  rank-benchmark:
    name: rank benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.6
          install: true
          install_args: rust
          cache: true
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.0-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-1.97.0-cargo-
      - name: Run rank benchmark
        run: cargo run --release --locked --example rank_bench

  fuzz:
    name: ${{ matrix.target }} fuzz
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        target: [automation_plan_parse, markdown_frontmatter_parse]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup nightly Rust
        # Pinned to a SHA, so the toolchain can no longer be inferred from the
        # `@nightly` ref and must be named explicitly.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly
      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-nightly-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-rust-nightly-cargo-
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} for five minutes
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300
      - name: Upload fuzz crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts
          if-no-files-found: ignore
