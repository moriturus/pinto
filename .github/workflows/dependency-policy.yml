name: Dependency policy

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    name: dependency security and licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.7.6
          install: true
          install_args: rust cargo:cargo-audit cargo:cargo-deny
          cache: true
      - name: Audit known vulnerabilities
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run audit
      - name: Check dependency policy
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run deny
