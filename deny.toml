# Check the complete dependency graph used by release builds.
[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Deny duplicate versions so a newly introduced duplicate fails the gate. The
# skip list records the currently approved duplicates pulled transitively; add a
# new entry (with a reason) only after a reviewed decision. See
# docs/dependencies.md.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
    { crate = "hashbrown@0.16.1", reason = "Transitive: older release still pulled alongside hashbrown 0.17." },
    { crate = "syn@2.0.118", reason = "Transitive proc-macro dependencies still require syn 2; updated clap, serde, and thiserror use syn 3." },
    { crate = "unicode-width@0.1.14", reason = "Transitive: older release still pulled alongside unicode-width 0.2." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
